name: Test & deploy to Cloudflare Pages

# 0.1.0: сайт — https://simpletraining.app/ на Cloudflare Pages (приложение в корне).
# Порядок: проверки и все e2e → только если всё зелёное, выкладка на Cloudflare (Direct Upload).
# Cloudflare сам ничего не собирает: сломанная версия не может попасть к пользователям.
# Старый адрес fovae.github.io/training больше не обновляется (остался на 3.24).
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN (права «Cloudflare Pages: Edit») и
# CLOUDFLARE_ACCOUNT_ID — docs/ARCHITECTURE.md, «Хостинг и защита».

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Полная матрица iPhone (11, 13, 15 Pro Max, 17 Pro Max)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CF_PROJECT: simple-training

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://simpletraining.app/
    env:
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run theme:check
      - run: npm run legal:check
      - run: npm run build
      - name: E2E (iPhone / WebKit, Android / Chromium)
        run: |
          npx playwright install --with-deps webkit chromium
          npx playwright test
        env:
          FULL_MATRIX: ${{ inputs.full && '1' || '0' }}
      - name: Production build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # проект создаётся при первой выкладке (если его ещё нет), дальше — только выкладка
          preCommands: npx wrangler pages project create ${{ env.CF_PROJECT }} --production-branch=main || true
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main --commit-dirty=true
