name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Полная матрица iPhone (11, 13, 15 Pro Max, 17 Pro Max)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Для GitHub Pages сайт живёт в /<имя-репозитория>/
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run theme:check
      - run: npm run legal:check
      - run: npm run build
      - name: E2E (iPhone / WebKit)
        run: |
          npx playwright install --with-deps webkit chromium
          npx playwright test
        env:
          BASE_PATH: /
          FULL_MATRIX: ${{ inputs.full && '1' || '0' }}
      - name: Rebuild for Pages
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
