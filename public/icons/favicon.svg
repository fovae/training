<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Исходник иконки. Квадрат без скруглений: iOS и Android скругляют сами.
       Всё значимое — в безопасной зоне maskable (круг 80% по центру). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE7150"/>
      <stop offset="1" stop-color="#D9502F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#g)"/>
  
  <g transform="rotate(-30 512 512)" fill="#fff">
    <rect x="300" y="490" width="424" height="44" rx="22"/>
    <rect x="322" y="362" width="76" height="300" rx="30"/>
    <rect x="244" y="404" width="62" height="216" rx="26"/>
    <rect x="626" y="362" width="76" height="300" rx="30"/>
    <rect x="718" y="404" width="62" height="216" rx="26"/>
  </g>
</svg>
