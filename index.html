<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Simple Training — Workout Planner &amp; Progress Tracker</title>
    <meta
      name="description"
      content="Plan workouts, log sets, and track progress with a free, ad-free workout planner. Your training data stays on your device."
    />
    <link rel="canonical" href="https://fovae.github.io/training/" />

    <!-- Предпросмотр ссылки (Open Graph, Twitter/X). Адрес сайта — GitHub Pages (README); при смене
         домена поменять og:url, canonical и оба адреса картинки. og-image.png — иконка icon-512.png без
         изменений в центре карточки 1200×630 на продолжении её собственного фона. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Simple Training" />
    <meta property="og:title" content="Simple Training — Plan. Train. Track." />
    <meta
      property="og:description"
      content="A simple workout planner to build your routine, log each session, and follow your progress. Your training data stays on your device."
    />
    <meta property="og:url" content="https://fovae.github.io/training/" />
    <meta property="og:image" content="https://fovae.github.io/training/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Simple Training app icon" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simple Training — Plan. Train. Track." />
    <meta
      name="twitter:description"
      content="A simple workout planner to build your routine, log each session, and follow your progress. Your training data stays on your device."
    />
    <meta name="twitter:image" content="https://fovae.github.io/training/og-image.png" />
    <meta name="twitter:image:alt" content="Simple Training app icon" />
    <meta name="author" content="Fovae &amp; Claude" />

    <!-- Цвет системных панелей: по теме системы, затем уточняется скриптом по ручной теме -->
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS: запуск как приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Simple Training" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Иконка одна на все темы (npm run icons) -->
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3.12" />
    <!-- apple-touch-startup-image для iPhone 11–18 добавляет плагин в vite.config.ts -->

    <script>
      // Тема, анимации и язык применяются до отрисовки, чтобы не было вспышки чужого цвета
      // (tp-boot — зеркало настроек). Темы нет или она неизвестна — «Авто» (по системной теме).
      // Карта удалённых тем и список действующих — как THEME_MIGRATION (src/db/migrations.ts) и
      // THEMES (src/types): совпадение проверяет юнит-тест.
      (function () {
        var d = document.documentElement;
        d.dataset.theme = 'auto';
        // iOS, запуск с экрана «Домой»: метка для стилей (src/styles/layout.css — высота страницы)
        if (navigator.standalone === true) d.dataset.standalone = '';
        try {
          var b = JSON.parse(localStorage.getItem('tp-boot') || '{}');
          var old = {
            light: 'gradient',
            dark: 'classic-dark',
            system: 'auto',
            'classic-orange': 'gradient',
            'gradient-1': 'gradient',
            ember: 'gradient',
            blue: 'slate-blue',
            violet: 'violet-dusk',
            green: 'pine-dusk',
            rose: 'rose-dusk',
            'gradient-2': 'golden-hour',
            'ocean-night': 'golden-hour',
            'teal-night': 'pine-dusk',
            'crimson-night': 'coffee-dusk'
          };
          var known =
            'classic-light classic-dark monochrome gradient pine-dusk golden-hour violet-dusk rose-dusk slate-blue sun-paper coffee-dusk';
          var th = old.hasOwnProperty(b.theme) ? old[b.theme] : b.theme;
          var ok = typeof th === 'string' && (' ' + known + ' ').indexOf(' ' + th + ' ') >= 0;
          if (ok) d.dataset.theme = th;
          // анимации по умолчанию включены (3.15); «как в системе» — только если выбрано так
          if (b.motion === 'on' || b.motion === 'off') d.dataset.motion = b.motion;
          else if (b.motion !== 'system') d.dataset.motion = 'on';
          if (b.locale) d.lang = b.locale;
          // theme-color: у «Авто» — два мета-тега по системной теме, у выбранной темы — её фон
          var tc = b.themeColor;
          if (ok && th === b.theme && typeof tc === 'string' && /^#[0-9a-f]{6}$/i.test(tc))
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.content = tc;
            });
        } catch (e) {}
      })();
    </script>
    <!--
      Загрузочный экран (#boot): виден, пока идёт начальная загрузка (скрипты, база, язык), и убирается
      в тот же кадр, когда приложение готово (App.tsx) — анимацию не дожидаемся. Разметка и стили здесь,
      а не в бандле: рисуются с первого кадра, до скриптов, и офлайн — index.html в кэше service worker.
      Знак — гантель из иконки (public/icons/favicon.svg, три фигуры): там же, где на iOS-заставке
      (26% меньшей стороны, центр чуть выше середины). Цвета — из темы: гантель --ink, диски --accent.
      Быстрый запуск ничего не показывает: всё проявляется с задержкой 180 мс. Сборка: гриф с дисками
      проявляется, внешние диски приезжают по оси грифа, знак делает один мягкий подъём и опускается,
      ниже проявляется название; дальше — неподвижно. Только transform и opacity (motion.unit.spec).
      Без анимаций (настройка или система) — то же проявление одной прозрачностью, без движения.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg, #f6f6f7);
        color: var(--ink, #1c1c20);
        --s: clamp(88px, 26vmin, 148px);
      }
      .boot-in {
        position: absolute;
        inset: calc(50% - var(--s) * 0.62) 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .boot-mark {
        display: block;
        width: var(--s);
        height: var(--s);
        overflow: visible;
      }
      .boot-name {
        margin-top: 4px;
        font: 700 20px/1.2 var(--font, system-ui, sans-serif);
        letter-spacing: -0.01em;
      }
      .boot-bar {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-bar 400ms var(--ease-out, ease-out) 180ms both;
      }
      .boot-r,
      .boot-l {
        fill: var(--accent, currentColor);
        animation: boot-r 440ms var(--ease-out, ease-out) 320ms both;
      }
      .boot-l {
        animation-name: boot-l;
      }
      .boot-lift {
        animation: boot-lift 720ms var(--ease-in-out, ease-in-out) 760ms both;
      }
      .boot-name {
        animation: boot-rise 460ms var(--ease-out, ease-out) 620ms both;
      }
      @keyframes boot-bar {
        from {
          opacity: 0;
          transform: scale(0.84);
        }
      }
      @keyframes boot-r {
        from {
          opacity: 0;
          transform: translate(30px, -15px);
        }
      }
      @keyframes boot-l {
        from {
          opacity: 0;
          transform: translate(-30px, 15px);
        }
      }
      @keyframes boot-lift {
        45% {
          transform: translateY(-22px);
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
        }
      }
      /* без анимаций: общее правило motion.css обнулило бы и задержку — здесь она своя */
      :root[data-motion='off'] #boot .boot-in {
        animation: boot-fade 280ms ease-out 180ms both !important;
      }
      :root[data-motion='off'] #boot .boot-in * {
        animation: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion='on']) #boot .boot-in {
          animation: boot-fade 280ms ease-out 180ms both !important;
        }
        :root:not([data-motion='on']) #boot .boot-in * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true">

            />
            <path
              class="boot-r"
              d="M351.7 140.0L356.0 132.3L361.2 128.0L366.0 125.8L372.0 125.1L378.0 125.8L382.0 127.5L388.0 132.6L392.2 138.0L434.3 216.0L436.7 222.0L437.5 228.0L437.6 232.0L436.5 238.0L434.8 242.0L430.0 247.7L426.0 250.9L422.0 252.7L416.0 253.3L410.0 252.8L406.0 250.8L402.0 247.4L399.4 244.0L364.7 176.0L353.6 156.0L351.7 152.0L350.9 148.0Z"

            />
          </g>
        </svg>
        <span class="boot-name">Simple Training</span>
      </div>
    </div>
    <noscript>Simple Training needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
