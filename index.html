<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Simple Training</title>
    <meta
      name="description"
      content="Plan your training week and log your sets. Rest timer and history. Works offline; your data stays on your device."
    />
    <meta name="author" content="Fovae &amp; Claude" />

    <!-- Цвет системных панелей: по теме системы, затем уточняется скриптом по ручной теме -->
    <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS: запуск как приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Simple Training" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />
    <!-- apple-touch-startup-image для iPhone 11–18 добавляет плагин в vite.config.ts -->

    <script>
      // Тема и язык применяются до отрисовки, чтобы не было вспышки (tp-boot — зеркало настроек).
      // Старые значения темы (light / dark / system) — как в миграции v2 → v3.
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem('tp-boot') || '{}');
          var old = { light: 'classic-orange', dark: 'classic-dark', system: 'auto' };
          var th = old[b.theme] || b.theme;
          if (typeof th === 'string' && /^[a-z0-9-]{3,20}$/.test(th))
            document.documentElement.dataset.theme = th;
          if (b.locale) document.documentElement.lang = b.locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-hidden="true"></div>
    </div>
    <noscript>Simple Training needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
