<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Simple Training — Workout Planner &amp; Progress Tracker</title>
    <meta
      name="description"
      content="Plan workouts, log sets, and track progress with a free, ad-free workout planner. Your training data stays on your device."
    />
    <link rel="canonical" href="https://fovae.github.io/training/" />

    <!-- Предпросмотр ссылки (Open Graph, Twitter/X). Адрес сайта — GitHub Pages (README); при смене
         домена поменять og:url, canonical и оба адреса картинки. og-image.png — иконка icon-512.png без
         изменений в центре карточки 1200×630 на продолжении её собственного фона. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Simple Training" />
    <meta property="og:title" content="Simple Training — Plan. Train. Track." />
    <meta
      property="og:description"
      content="A simple workout planner to build your routine, log each session, and follow your progress. Your training data stays on your device."
    />
    <meta property="og:url" content="https://fovae.github.io/training/" />
    <meta property="og:image" content="https://fovae.github.io/training/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Simple Training app icon" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simple Training — Plan. Train. Track." />
    <meta
      name="twitter:description"
      content="A simple workout planner to build your routine, log each session, and follow your progress. Your training data stays on your device."
    />
    <meta name="twitter:image" content="https://fovae.github.io/training/og-image.png" />
    <meta name="twitter:image:alt" content="Simple Training app icon" />
    <meta name="author" content="Fovae &amp; Claude" />

    <!-- Цвет системных панелей: по теме системы, затем уточняется скриптом по ручной теме -->
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS: запуск как приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Simple Training" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Иконка одна на все темы (npm run icons) -->
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- apple-touch-startup-image для iPhone 11–18 добавляет плагин в vite.config.ts -->

    <script>
      // Тема, анимации и язык применяются до отрисовки, чтобы не было вспышки чужого цвета
      // (tp-boot — зеркало настроек). Темы нет или она неизвестна — «Авто» (по системной теме).
      // Карта удалённых тем и список действующих — как THEME_MIGRATION (src/db/migrations.ts) и
      // THEMES (src/types): совпадение проверяет юнит-тест.
      (function () {
        var d = document.documentElement;
        d.dataset.theme = 'auto';
        // iOS, запуск с экрана «Домой»: метка для стилей (src/styles/layout.css — высота страницы)
        if (navigator.standalone === true) d.dataset.standalone = '';
        try {
          var b = JSON.parse(localStorage.getItem('tp-boot') || '{}');
          var old = {
            light: 'gradient',
            dark: 'classic-dark',
            system: 'auto',
            'classic-orange': 'gradient',
            'gradient-1': 'gradient',
            ember: 'gradient',
            blue: 'slate-blue',
            violet: 'violet-dusk',
            green: 'pine-dusk',
            rose: 'rose-dusk',
            'gradient-2': 'golden-hour',
            'ocean-night': 'golden-hour',
            'teal-night': 'pine-dusk',
            'crimson-night': 'coffee-dusk'
          };
          var known =
            'classic-light classic-dark monochrome gradient pine-dusk golden-hour violet-dusk rose-dusk slate-blue sun-paper coffee-dusk';
          var th = old.hasOwnProperty(b.theme) ? old[b.theme] : b.theme;
          var ok = typeof th === 'string' && (' ' + known + ' ').indexOf(' ' + th + ' ') >= 0;
          if (ok) d.dataset.theme = th;
          if (b.motion === 'on' || b.motion === 'off') d.dataset.motion = b.motion;
          if (b.locale) d.lang = b.locale;
          // theme-color: у «Авто» — два мета-тега по системной теме, у выбранной темы — её фон
          var tc = b.themeColor;
          if (ok && th === b.theme && typeof tc === 'string' && /^#[0-9a-f]{6}$/i.test(tc))
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.content = tc;
            });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-hidden="true"></div>
    </div>
    <noscript>Simple Training needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
